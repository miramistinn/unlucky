<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="normalize.css" />
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <style>
        body {
            background-color: black;
            color: white;
        }f:\5 сем\курсач\front\reg.html
        .reg {
            background-color: #111;
            padding: 20px;
            margin-top: 50px;
            border-radius: 5px;
            margin-left: auto;
            margin-right: auto;
            max-width: 500px;
        }
        .form-control {
            background-color: #222;
            color: #bbb;
            height: 70px; 
            border-radius: 15px; /* Скругление полей */
            font-size: 18px; /* Увеличение шрифта */
        }
        .mb-3 {
            margin-bottom: 60px; /* Увеличение расстояния между полями ввода */
        }
        .btn-primary {
            background-color: #B43131; /* Красный цвет фона */
            border-color: #B43131; /* Красный цвет границы */
            padding: 15px 150px; /* Увеличение размера кнопки */
            font-size: 18px; /* Увеличение шрифта кнопки */
            border-radius: 15px; /* Скругление кнопки */
            text-decoration: none; /* Убрать подчеркивание */
        }
        .btn-primary:hover {
            background-color: darkred; /* Более тёмный красный при наведении */
            border-color: darkred; /* Более тёмный красный границы при наведении */
        }
        .center {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column; /* Вертикальное расположение */
            margin-top: 40px;
            margin-bottom: 10px;
        }
        .link-secondary {
            color: #bbb; /* Цвет ссылки */
            font-size: 18px; /* Размер шрифта */
            text-decoration: none; /* Убрать подчеркивание */
        }
        .link-secondary:hover {
            color: #fff; /* Цвет ссылки при наведении */
            text-decoration: underline; /* Подчеркивание при наведении */
        }
        #applicationsList {
            margin-top: 20px;
            background-color: #222;
            padding: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <nav>
              <ul>
                <a href="home.html">
                  <li>Главная</li>
                </a>
                <a href="index.html">
                  <li>Банкетные залы</li>
                </a>
                <a href="index.html">
                  <li>Меню</li>
                </a>
                <a href="index.html">
                  <li>Доп услуги</li>
                </a>
                <a href="log.html">
                  <li>Войти</li>
                </a>
              </ul>
            </nav>
        </header>
    </div>

    <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
    
    <div class="reg" id="authForm" style="display: none;">
        <h2 class="text-center">Авторизация</h2>
        <div style="margin-bottom: 30px;"></div>
        <form id="registrationForm">
            <div class="mb-3">
                <input type="email" class="form-control" id="email" placeholder="Введите email" required>
            </div>

            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Введите пароль" required>
            </div>
            <div class="center">
                <button type="submit" class="btn btn-primary">Войти</button> 
                <a href="reg.html" class="link-secondary mt-3">Регистрация</a>
            </div>
        </form>
    </div>

    <div class="center" id="clientMessage" style="display: none; margin-left: 40%;">
        <p style=" margin-left: 11%;">У вас еще нет заявки.</p>
        <button class="btn btn-primary" onclick="logout()">Выйти</button>
    </div>
    <div class="center" id="adminMessage" style="display: none; margin-left: 40%;">
        <p style=" margin-left: 6%;">Вы уверены, что хотите выйти?</p>
        <button class="btn btn-primary" onclick="logout()">Выйти</button>
    </div>
    <div class="center" id="clientHaveMessage" style="display: none;  margin-left: 40%;">
        <button class="btn btn-primary" onclick="logout()">Выйти</button>
    </div>

    <div id="applicationsList" style="display: none;"></div> 

    <script>
        // Функция для обработки отправки формы
        function submitForm(event) {
            event.preventDefault(); // Предотвращаем отправку формы по умолчанию

            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;

            var data = {
                email: email,
                password: password
            };

            fetch('http://localhost:8080/log/logIn', {
                method: "post",
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.text())
            .then(text => {
                if (text === 'client') {
                    window.location.href = "home.html";
                } else if (text === 'admin') {
                    window.location.href = "applications.html";
                } else {
                    console.log('Текст не совпадает');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                var errorMessageElement = document.getElementById('errorMessage');
                errorMessageElement.innerText = 'Неверно введен логин или пароль';
                errorMessageElement.style.display = 'block';
            });
        }

        // Функция для проверки логина при загрузке страницы
        function checkLogin() {
            fetch('http://localhost:8080/log/check', {
                method: 'post'
            })
            .then(response => response.text())
            .then(text => {
                if (text === 'no') {
                    document.getElementById('authForm').style.display = 'block';
                } else if (text === 'client') {
                    document.getElementById('clientMessage').style.display = 'block';
                } else if (text === 'client have') {
                    document.getElementById('clientHaveMessage').style.display = 'block';
                    loadApplications(); // Загружаем заявки
                } else if (text === 'admin') {
                    document.getElementById('adminMessage').style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        // Функция для загрузки заявок
        function loadApplications() {
            fetch('http://localhost:8080/log/readApp', {
                method: 'post'
            })
            .then(response => response.json())
            .then(applications => {
                const applicationsList = document.getElementById('applicationsList');
                applicationsList.style.display = 'block';
                applicationsList.innerHTML = '<h3 class="text-center">Ваши заявки</h3>';

                if (applications.length > 0) {
                    applications.forEach(app => {
                        const appItem = document.createElement('div');
                        appItem.className = 'mb-2';
                        appItem.innerHTML = `
                            <strong>Дата:</strong> ${new Date(app.dateOfCreated).toLocaleString()}<br>
                            <strong>ФИО:</strong> ${app.name} ${app.surname} ${app.patronymic}<br>
                            <strong>Комментарий:</strong> ${app.comments}
                        `;
                        applicationsList.appendChild(appItem);
                    });
                } else {
                    applicationsList.innerHTML += '<p>Заявок нет.</p>';
                }
            })
            .catch(error => {
                console.error('Ошибка при загрузке заявок:', error);
            });
        }

        function logout() {
            fetch('http://localhost:8080/log/logOut', {
                method: 'post'
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = "home.html";
                } else {
                    console.error('Ошибка при выходе:', response.statusText);
                }
            })
            .catch(error => {
                console.error('Ошибка при отправке запроса:', error);
            });
        }

        // Получаем форму по ее ID
        var form = document.getElementById('registrationForm');
        // Назначаем обработчик события отправки формы
        form.addEventListener('submit', submitForm);

        // Проверяем логин при загрузке страницы
        window.onload = checkLogin;
    </script>
</body>
</html>
