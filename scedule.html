<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заявки</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: black;
            color: white;
        }

        #applicationTable {
            color: white;
        }
        
        #sortSelect {
            width: 160px;
        }

        .nav-itemm {
            margin-right: 20px;
        }

        .nav-itemm:hover {
            color: #c9d6e3;
            transform: translateY(-5px);
        }

        .nav {
            padding-left: 12.5%;
        }

        .nav-link {
            color: white; 
            transition: color 0.3s, transform 0.3s; /* Плавный переход для цвета и смещения */
        }

        .nav-link:hover {
            color: #c9d6e3; 
            transform: translateY(-5px); /* Смещение вверх при наведении */
        }

        .table {
            margin: 0 10%;
            width: 80%;
            border: none;
            border-collapse: collapse; /* Убираем двойные границы между ячейками */
        }

        .table thead th {
            padding: 10px;
            font-weight: 500;
            font-size: 16px;
            line-height: 20px;
            text-align: center;
            color: #ffffff;
        }

        .table tbody td {
            padding: 10px;
            font-size: 14px;
            line-height: 20px;
            color: #ffffff;
            border-top: 1px solid #ffffff;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        select {
            width: 100%; /* Ширина 100% для элементов ввода */
            padding: 8px; /* Отступы внутри элементов ввода */
            border: 1px solid #0097d8; /* Граница для элементов ввода */
            border-radius: 10px; /* Закругленные углы */
            box-sizing: border-box; /* Учитываем отступы и границы в ширине */
        }

        .button {
            border: none; /* Убираем границу */
            border-radius: 10px; /* Закругленные углы кнопки */
            padding: 8px 16px; /* Отступы внутри кнопки */
            cursor: pointer; /* Указатель при наведении */
            font-size: 14px; /* Размер шрифта кнопки */
            width: 130px; /* Фиксированная ширина для одинакового размера */
            margin-right: 5px; /* Отступ между кнопками */
        }

        .edit-btn {
            background-color: #0097d8; /* Цвет фона для кнопки редактирования */
            color: white; /* Цвет текста кнопки */
            transition: background-color 0.3s; /* Плавный переход цвета фона */
        }

        .edit-btn:hover {
            background-color: #0b5a7c; /* Темнее при наведении */
        }

        .delete-btn {
            background-color: #B43131; /* Цвет фона для кнопки удаления */
            color: white; /* Цвет текста кнопки */
            transition: background-color 0.3s; /* Плавный переход цвета фона */
        }

        .delete-btn:hover {
            background-color: #8b1521; /* Темнее при наведении */
        }

        /* Задаем фиксированную ширину для последней колонки */
        .table td:last-child {
            width: 300px; /* Установите нужную ширину */
            text-align: center; /* Центрируем текст в ячейках */
        }
    </style>
</head>
<body>   
    <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"></a>
            <ul class="nav nav-pills">
                <li class="nav-item">
                    <a href="/new.html" class="nav-link">Новые</a>
                </li>
                <li class="nav-item">
                    <a href="/process.html" class="nav-link">Действующие</a>
                </li>
                <li class="nav-item">
                    <a href="/closed.html" class="nav-link">Закрытые</a>
                </li>
                <li class="nav-item">
                    <a href="/logoutorg.html" class="nav-link">Аккаунт</a>
                </li>
            </ul>
        </header>
    </div>

    <div>
        <ul class="nav nav-pills mb-4">
            <li class="nav-itemm">
                <a class="nav-link" href="#" id="baseLink">Базовая информация</a>
            </li>
            <li class="nav-itemm">
                <a class="nav-link" href="#" id="menuLink">Смета</a>
            </li>
            <li class="nav-itemm">
                <a class="nav-link" href="#" id="dopServicesLink">Расписание</a>
            </li>
            <li class="nav-itemm">
                <a class="nav-link" href="#" id="closeApplicationLink">Закрыть заявку</a>
            </li>
        </ul>
    </div>

    <table id="product-table" class="table">
        <thead>
            <tr>
                <th>Дата</th>
                <th>Время</th>
                <th>Место</th>
                <th>Комментарий</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="date" id="date-1" /></td>
                <td><input type="time" id="time-1" /></td>
                <td><input type="text" id="location-1" placeholder="Введите место" /></td>
                <td><input type="text" id="comment-1" placeholder="Введите комментарий" /></td>
                <td>
                    <button class="button" id="save-new-schedule">Добавить</button>
                </td>
            </tr>
        </tbody>
        <tbody id="schedule-table-body">
        </tbody>
    </table>

    <script>
        function addScheduleEventListeners() {
            const scheduleTableBody = document.getElementById("schedule-table-body");

            scheduleTableBody.querySelectorAll(".edit-btn").forEach(button => {
                button.addEventListener("click", () => {
                    const row = button.closest("tr");
                    const cells = row.querySelectorAll("td");

                    // Преобразуем ячейки в поля ввода
                    const date = cells[0].textContent;
                    const time = cells[1].textContent;
                    const place = cells[2].textContent;
                    const comments = cells[3].textContent;

                    cells[0].innerHTML = `<input type="date" value="${date}">`;
                    cells[1].innerHTML = `<input type="time" value="${time}">`;
                    cells[2].innerHTML = `<input type="text" value="${place}">`;
                    cells[3].innerHTML = `<input type="text" value="${comments}">`;

                    // Изменяем кнопки
                    button.style.display = "none";
                    const saveButton = row.querySelector(".save-btn");
                    saveButton.style.display = "inline-block";
                });
            });

            scheduleTableBody.querySelectorAll(".save-btn").forEach(button => {
                button.addEventListener("click", () => {
                    const row = button.closest("tr");
                    const inputs = row.querySelectorAll("input");
                    const itemId = button.getAttribute("data-item-id");
                    const updatedData = {
                        date: inputs[0].value + 'T' + inputs[1].value,
                        place: inputs[2].value,
                        comments: inputs[3].value,
                        id: itemId
                    };

                    fetch(`http://localhost:8080/proc/scedule/update`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(updatedData)
                    })
                    .then(response => {
                        if (!response.ok) throw new Error("Ошибка сети");
                        return response.json();
                    })
                    .then(() => {
                        loadSchedules(); // Перезагружаем расписание
                    })
                    .catch(error => {
                        console.error("Ошибка при обновлении данных:", error);
                        alert("Не удалось обновить данные.");
                    });
                });
            });

            scheduleTableBody.querySelectorAll(".delete-btn").forEach(button => {
                button.addEventListener("click", () => {
                    const itemId = button.getAttribute("data-item-id");

                    fetch(`http://localhost:8080/proc/scedule/delete/${itemId}`, {
                        method: "DELETE",
                        headers: { "Content-Type": "application/json" }
                    })
                    .then(response => {
                        if (!response.ok) throw new Error("Ошибка сети");
                        return response.json();
                    })
                    .then(() => {
                        loadSchedules(); // Перезагружаем расписание
                    })
                    .catch(error => {
                        console.error("Ошибка при удалении данных:", error);
                        alert("Не удалось удалить данные.");
                    });
                });
            });
        }

        function loadSchedules() {
            const scheduleTableBody = document.getElementById("schedule-table-body");
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (id) {
                const apiUrl = `http://localhost:8080/proc/scedule/read/${id}`;

                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) throw new Error('Ошибка сети');
                        return response.json();
                    })
                    .then(data => {
                        if (Array.isArray(data)) {
                            // Сортируем данные по дате в порядке возрастания
                            data.sort((a, b) => new Date(a.date) - new Date(b.date));

                            scheduleTableBody.innerHTML = ''; // Очищаем текущие строки

                            data.forEach(schedule => {
                                const row = document.createElement("tr");
                                const date = new Date(schedule.date);

                                row.innerHTML = `
                                    <td>${date.toISOString().split('T')[0]}</td>
                                    <td>${date.toTimeString().split(' ')[0]}</td>
                                    <td>${schedule.place}</td>
                                    <td>${schedule.comments}</td>
                                    <td>
                                        <button class="button edit-btn">Редактировать</button>
                                        <button class="button delete-btn" data-item-id="${schedule.id}">Удалить</button>
                                        <button class="button save-btn" style="display: none;" data-item-id="${schedule.id}">Сохранить</button>
                                    </td>
                                `;

                                scheduleTableBody.appendChild(row);
                            });

                            addScheduleEventListeners(); // Добавляем обработчики событий
                        } else {
                            console.error("Полученные данные не являются массивом");
                        }
                    })
                    .catch(error => {
                        console.error("Ошибка при загрузке данных:", error);
                    });
            } else {
                console.error("Параметр 'id' не найден в URL");
            }
        }

        function setupNavigationLinks(applicationId) {
            document.getElementById('baseLink').addEventListener('click', function() {
                window.location.href = `/basicInformation.html?id=${applicationId}`;
            });
            document.getElementById('menuLink').addEventListener('click', function() {
                window.location.href = `/smeta.html?id=${applicationId}`;
            });
            document.getElementById('dopServicesLink').addEventListener('click', function() {
                window.location.href = `/scedule.html?id=${applicationId}`;
            });
            document.getElementById('closeApplicationLink').addEventListener('click', function() {
                fetch(`http://localhost:8080/app/close/${applicationId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => {
                    if (response.ok) {
                        window.location.href = 'new.html';
                    } else {
                        throw new Error('Ошибка при закрытии');
                    }
                });
            });
        }
        function addNewSchedule(applicationId) {
    const dateInput = document.getElementById("date-1");
    const timeInput = document.getElementById("time-1");
    const locationInput = document.getElementById("location-1");
    const commentInput = document.getElementById("comment-1");

    const date = dateInput.value;
    const time = timeInput.value;
    const location = locationInput.value;
    const comment = commentInput.value;

    if (!date || !time || !location) {
        alert("Пожалуйста, заполните все обязательные поля (дата, время, место).");
        return;
    }

    const dto = {
        date: date + 'T' + time,
        place: location,
        comments: comment
    };

    fetch(`http://localhost:8080/proc/scedule/create/${applicationId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dto)
    })
    .then(response => {
        if (!response.ok) throw new Error("Ошибка при создании записи");
        return response.json();
    })
    .then(() => {
        dateInput.value = '';
        timeInput.value = '';
        locationInput.value = '';
        commentInput.value = '';
        loadSchedules(); // Перезагрузка расписания
    })
    .catch(error => {
        console.error("Ошибка при добавлении записи:", error);
        alert("Не удалось добавить запись.");
    });
}
        document.addEventListener("DOMContentLoaded", function() {
    const urlParams = new URLSearchParams(window.location.search);
    const applicationId = urlParams.get('id');

    if (!applicationId) {
        console.error('Не найден параметр id в URL.');
        return;
    }

    loadSchedules();
    setupNavigationLinks(applicationId);

    document.getElementById("save-new-schedule").addEventListener("click", function () {
        addNewSchedule(applicationId);
    });
});

    </script>

    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
</body>
</html>
