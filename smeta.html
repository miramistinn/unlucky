<script>
let allExpenses = [];
window.addEventListener('DOMContentLoaded', () => {
  fetch('http://localhost:8080/proc/expenses/read')
    .then(response => response.json())
    .then(data => {
      allExpenses = data;
      const categories = [...new Set(data.map(exp => exp.category))];
      const categorySelect = document.getElementById('category-select');
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
    })
    .catch(error => {
      console.error('Ошибка при загрузке категорий:', error);
    });
});

// Обновление подсказок при выборе категории
document.getElementById('category-select').addEventListener('change', () => {
  const selectedCategory = document.getElementById('category-select').value;
  const nameDatalist = document.getElementById('name-datalist');
  nameDatalist.innerHTML = '';

  const filteredNames = allExpenses
    .filter(exp => exp.category === selectedCategory)
    .map(exp => exp.name);

  [...new Set(filteredNames)].forEach(name => {
    const option = document.createElement('option');
    option.value = name;
    nameDatalist.appendChild(option);
  });
});

// Автоматическая подстановка цены при выборе известной траты
document.getElementById('name-1').addEventListener('input', () => {
  const category = document.getElementById('category-select').value;
  const name = document.getElementById('name-1').value;
  const match = allExpenses.find(exp => exp.category === category && exp.name === name);

  if (match) {
    document.getElementById('price-1').value = match.cost;
  }
});
// Функция для обновления итоговой суммы
function updateTotal() {
  const cost = parseFloat(document.getElementById('price-1').value) || 0;
  const quantity = parseInt(document.getElementById('quantity-1').value) || 0;
  const total = cost * quantity;
  document.getElementById('total-1').value = total.toFixed(2);
}

// Добавление обработчиков событий на поля ввода цены и количества
document.getElementById('price-1').addEventListener('input', updateTotal);
document.getElementById('quantity-1').addEventListener('input', updateTotal);

</script>

<script>
    // Получение applicationId из параметров URL
     const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    
    
    // Функция для загрузки данных сметы
    function loadSmetaData() {
        if (!id) {
            console.error('ID заявки не найден в URL.');
            alert('ID заявки не найден.');
            return;
        }
    
        fetch(`http://localhost:8080/proc/smeta/read/${id}`)
            .then(response => {
                if (!response.ok) throw new Error('Ошибка сети: ' + response.statusText);
                return response.json();
            })
            .then(data => {
                const tbody = document.querySelector('#product-table tbody');
                const firstRow = tbody.querySelector('tr:first-child');
                tbody.innerHTML = '';
                tbody.appendChild(firstRow);
                let totalSum = 0;
    
                data.forEach(item => {
                    if (item.expenses && item.expenses.category && item.expenses.name && item.expenses.cost && item.quantity) {
                        const row = document.createElement('tr');
                        const total = item.expenses.cost * item.quantity;
                        totalSum += total;
    
                        row.innerHTML = `
                            <td><input type="text" value="${item.expenses.category}" disabled /></td>
                            <td><input type="text" value="${item.expenses.name}" disabled /></td>
                            <td><input type="number" value="${item.expenses.cost}" disabled /></td>
                            <td><input type="number" value="${item.quantity}" disabled /></td>
                            <td><input type="text" value="${total}" disabled /></td>
                            <td>
                                <button class="button edit-btn">Редактировать</button>
                                <button class="button delete-btn" data-item-id="${item.id}">Удалить</button>
                                <button class="button save-btn" style="display: none;" data-item-id="${item.id}">Сохранить</button>
                            </td>
                        `;
                        tbody.appendChild(row);
                    } else {
                        console.warn('Некоторые свойства отсутствуют в объекте:', item);
                    }
                });
    
                document.getElementById('totalSum').textContent = totalSum;
    
                const editButtons = document.querySelectorAll('.edit-btn');
                const saveButtons = document.querySelectorAll('.save-btn');
                const deleteButtons = document.querySelectorAll('.delete-btn');
    
                editButtons.forEach((button, index) => {
                    button.addEventListener('click', () => {
                        const row = button.closest('tr');
                        const inputs = row.querySelectorAll('input');
                        const isEditing = inputs[0].disabled;
                        inputs.forEach(input => input.disabled = !isEditing);
                        button.style.display = isEditing ? 'none' : 'inline-block';
                        saveButtons[index].style.display = isEditing ? 'inline-block' : 'none';
                    });
                });
    
                saveButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        const itemId = button.getAttribute('data-item-id');
                        const row = button.closest('tr');
                        const inputs = row.querySelectorAll('input');
    
                        const updatedData = {
                            category: inputs[0].value,
                            name: inputs[1].value,
                            cost: parseFloat(inputs[2].value),
                            quantity: parseInt(inputs[3].value),
                        };
    
                        fetch(`http://localhost:8080/proc/smeta/update/${itemId}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(updatedData),
                        })
                        .then(response => {
                            if (!response.ok) throw new Error('Ошибка сети: ' + response.statusText);
                            return response.json();
                        })
                        .then(responseData => {
                            alert('Данные успешно обновлены!');
                            inputs.forEach(input => input.disabled = true);
                            button.style.display = 'none';
                            const editButton = row.querySelector('.edit-btn');
                            if (editButton) editButton.style.display = 'inline-block';
                            const total = updatedData.cost * updatedData.quantity;
                            inputs[4].value = total;
    
                            let newTotalSum = 0;
                            document.querySelectorAll('#product-table tbody tr:not(:first-child)').forEach(row => {
                                const cells = row.querySelectorAll('input');
                                const cost = parseFloat(cells[2].value) || 0;
                                const quantity = parseInt(cells[3].value) || 0;
                                newTotalSum += cost * quantity;
                            });
                            document.getElementById('totalSum').textContent = newTotalSum;
                        })
                        .catch(error => {
                            console.error('Ошибка при обновлении данных:', error);
                            alert('Не удалось обновить данные.');
                        });
                    });
                });
    
                deleteButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        const itemId = button.getAttribute('data-item-id');
                        const row = button.closest('tr');
                        const inputs = row.querySelectorAll('input');
    
                        const updatedData = {
                            category: inputs[0].value,
                            name: inputs[1].value,
                            cost: parseFloat(inputs[2].value),
                            quantity: parseInt(inputs[3].value),
                        };
    
                        fetch(`http://localhost:8080/proc/smeta/delete/${itemId}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                        })
                        .then(response => {
                            if (!response.ok) throw new Error('Ошибка сети: ' + response.statusText);
                            return response.json();
                        })
                        .then(responseData => {
                            alert('Данные успешно удалены!');
                            row.remove();
                            // Пересчёт общей суммы
                            let newTotalSum = 0;
                            document.querySelectorAll('#product-table tbody tr:not(:first-child)').forEach(row => {
                                const cells = row.querySelectorAll('input');
                                const cost = parseFloat(cells[2].value) || 0;
                                const quantity = parseInt(cells[3].value) || 0;
                                newTotalSum += cost * quantity;
                            });
                            document.getElementById('totalSum').textContent = newTotalSum;
                        })
                        .catch(error => {
                            console.error('Ошибка при удалении данных:', error);
                            alert('Не удалось удалить данные.');
                        });
                    });
                });
            })
    }
    
    // Загружаем данные сметы при загрузке страницы
    window.onload = loadSmetaData;
    
    document.getElementById('baseLink').addEventListener('click', function() {
            window.location.href = `/basicInformation.html?id=${id}`;
        });
        document.getElementById('menuLink').addEventListener('click', function() {
            window.location.href = `/smeta.html?id=${id}`;
        });
    
        document.getElementById('dopServicesLink').addEventListener('click', function() {
            window.location.href = `/scedule.html?id=${id}`;
        });
    
       
        document.getElementById('closeApplicationLink').addEventListener('click', function() {
            fetch(`http://localhost:8080/app/close/${id}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
            if (response.ok) {
                window.location.href = 'new.html';
            } else {
                throw new Error('Ошибка при закрытии');
            }
        })

        });
    </script>
