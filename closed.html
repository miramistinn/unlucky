<!DOCTYPE html>
<html>
<head>
    <title>Заявки</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: black;
            color: white;
        }

        #applicationTable {
            color: white;
        }
        .filter-container {
            margin-bottom: 20px;
        }
      
        #sortSelect {
            width: 160px;
        }
        .button {
            border: none; /* Убираем границу */
            border-radius: 10px; /* Закругленные углы кнопки */
            padding: 8px 16px; /* Отступы внутри кнопки */
            cursor: pointer; /* Указатель при наведении */
            font-size: 14px; /* Размер шрифта кнопки */
            width: 130px; /* Фиксированная ширина для одинакового размера */
            margin-right: 5px; /* Отступ между кнопками */
        }
        .edit-btn {
            background-color: #0097d8; /* Цвет фона для кнопки редактирования */
            color: white; /* Цвет текста кнопки */
            transition: background-color 0.3s; /* Плавный переход цвета фона */
        }

        .edit-btn:hover {
            background-color: #0b5a7c; /* Темнее при наведении */
        }

        .delete-btn {
            background-color: #B43131; /* Цвет фона для кнопки удаления */
            color: white; /* Цвет текста кнопки */
            transition: background-color 0.3s; /* Плавный переход цвета фона */
        }

        .delete-btn:hover {
            background-color: #8b1521; /* Темнее при наведении */
        }
    </style>
</head>
<body>   
    <div class="container">
        <header
        class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom"
      >
        <a
          href="/"
          class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"
        >
        </a>
  
        <ul class="nav nav-pills">
            <li class="nav-item">
                <a href="/new.html" class="nav-link ">Новые</a>
              </li><li class="nav-item">
                <a href="/process.html" class="nav-link">Действующие</a>
              </li><li class="nav-item">
                <a href="/closed.html" class="nav-link active">Закрытые</a>
              </li>
              <li class="nav-item">
                <a href="/login.html" class="nav-link">Аккаунт</a>
              </li>
        </ul>
      </header>
    </div>
    
    <div class="container">
        
        <h1>Закрытые заявки</h1>

        <div class="filter-container">
            <select id="sortSelect" class="form-select">
                <option value="newest">Самые новые</option>
                <option value="oldest">Самые старые</option>
            </select>
        </div>
        <table class="table" id="applicationTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Имя</th>
                    <th>Email</th>
                    <th>Телефон</th>
                    <th>Комментарий</th>
                    <th>Дата</th>
                    <th>Источник</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="applicationList"></tbody>
        </table>
    </div>

<script>
    let applications = []; // Массив для хранения полученных заявок

    // Функция для загрузки заявок
    function loadApplications() {
        fetch('http://localhost:8080/app/readclosed')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Сеть ответила с ошибкой: ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                applications = data; // Сохраняем данные в массив
                renderApplications(applications); // Отображаем заявки
            })
            .catch(error => {
                console.error('Ошибка:', error);
            });
    }

    // Функция для отображения заявок
    function renderApplications(applications) {
        const applicationList = document.getElementById('applicationList');
        applicationList.innerHTML = ''; // Очищаем предыдущие данные

        applications.forEach((application, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${application.user.name}</td>
                <td>${application.user.email}</td>
                <td>${application.user.phone}</td>
                <td>${application.comments}</td>
                <td>${new Date(application.dateOfCreated).toLocaleString()}</td>
                <td>${application.source}</td>
                    <td><button class="button edit-btn" onclick="startProcessing(${application.id})">Смотреть</button></td>
            `;  
            applicationList.appendChild(row);
        });
    }

    // Функция для сортировки заявок
    function sortApplications() {
        const sortValue = document.getElementById('sortSelect').value;
        const sortedApplications = [...applications]; // Создаем копию массива

        if (sortValue === 'newest') {
            sortedApplications.sort((a, b) => new Date(b.dateOfCreated) - new Date(a.dateOfCreated));
        } else if (sortValue === 'oldest') {
            sortedApplications.sort((a, b) => new Date(a.dateOfCreated) - new Date(b.dateOfCreated));
        }

        renderApplications(sortedApplications); // Отображаем отсортированные заявки
    }

    // Обработчик события для сортировки
    document.getElementById('sortSelect').addEventListener('change', sortApplications);
 
        // Функция для сортировки заявок
        function sortApplications(order) {
            const sortedApplications = applications.slice().sort((a, b) => {
                const dateA = new Date(a.dateOfCreated);
                const dateB = new Date(b.dateOfCreated);
                
                return order === 'oldest' ? dateA - dateB : dateB - dateA;
            });
            populateTable(sortedApplications);
        }

        // Обработчик события для выпадающего списка сортировки
        document.getElementById('sortSelect').addEventListener('change', function() {
            const selectedValue = this.value;
            sortApplications(selectedValue);
        });

        function startProcessing(id) {
            window.location.href = `/basicInformation.html?id=${id}`;
        }
    // Загрузка заявок при загрузке страницы
    window.onload = loadApplications;
</script>

</body>
</html>
