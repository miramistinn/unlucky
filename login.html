<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: black;
            color: white;
        }
        .reg {
            background-color: #111;
            padding: 20px;
            margin-top: 50px;
            border-radius: 5px;
            margin-left: 500px;
            margin-right: 500px;
        }
        .form-control {
            background-color: #222;
            color: #bbb;
            height: 70px; 
            border-radius: 15px; 
            font-size: 18px; 
        }
        .mb-3 {
            margin-bottom: 60px; 
        }
        .btn-primary {
            background-color: #354095;
            border-color: #354095;
            padding: 15px 150px; 
            font-size: 18px; 
            border-radius: 15px; 
            text-decoration: none; 
        }
        .btn-primary:hover {
            background-color: #251c4d; 
            border-color: #251c4d; 
        }
        .center {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column; 
            margin-bottom: 10px;
        }
        .link-secondary {
            color: #bbb; 
            font-size: 18px; 
            text-decoration: none; 
        }
        .link-secondary:hover {
            color: #fff; 
            text-decoration: underline; 
        }
        #applicationsList {
            margin-top: 20px;
            background-color: #222;
            padding: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
                <img src="images/img_1.png" width="150" height="40" alt="Картинка">
            </a>
            <ul class="nav nav-pills">
                <li class="nav-item"><a href="home.html" class="nav-link" aria-current="page">Главная</a></li>
                <li class="nav-item"><a href="contacs.html" class="nav-link">Контакты</a></li>
                <li class="nav-item"><a href="about.html" class="nav-link">О нас</a></li>
                <li class="nav-item"><a href="login.html" class="nav-link active">Аккаунт</a></li>
            </ul>
        </header>
    </div>
    <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
    <div class="reg" id="authForm">
        <h2 class="text-center">Авторизация</h2>
        <div style="margin-bottom: 30px;"></div>
        <form id="registrationForm">
            <div class="mb-3">
                <input type="email" class="form-control" id="email" placeholder="Введите email" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Введите пароль" required>
            </div>
            <div class="center">
                <button type="submit" class="btn btn-primary">Войти</button> 
            </div>
        </form>
    </div>
    <div class="center">
        <div class="mt-3">
            <a href="registration.html" class="link-secondary mt-3">Регистрация</a>
        </div>
    </div>
    <script>
       function submitForm(event) {
    event.preventDefault(); // Предотвращаем отправку формы по умолчанию

    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;

    var data = {
        email: email,
        password: password
    };

    fetch('http://localhost:8080/log/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
    })
    .then(response => {
        if (!response.ok) {
            // Если статус не OK, пытаемся получить сообщение об ошибке
            return response.json().then(err => {
                throw new Error(err.error || 'Ошибка авторизации');
            });
        }
        return response.json();
    })
    .then(response => {
        const role = response.role;
        if (role === 'ROLE_USER') {
            window.location.href = "home.html";
        } else if (role === 'ROLE_MANAGER') {
            window.location.href = "users.html";
        } else if (role === 'ROLE_ORGANIZER') {
            window.location.href = "new.html";
        } else {
            console.log('Неизвестная роль:', role);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        var errorMessageElement = document.getElementById('errorMessage');
        errorMessageElement.innerText = error.message || 'Неверно введен логин или пароль';
        errorMessageElement.style.display = 'block';
    });
}

// Добавление обработчика события к форме
var form = document.getElementById('registrationForm');
form.addEventListener('submit', submitForm);

    </script>
</body>
</html>
