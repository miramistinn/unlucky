<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #000000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .containerr {
            margin-top: 20px;
            margin-left: 200px;
            margin-right: 200px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #6c757d;
        }

        th {
            font-weight: bold;
        }

        .ban-button {
            background-color: #dc3545;
            color: #ffffff; 
            border: none;
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 8px;
        }

        .ban-button:hover {
            background-color: #88131f;
        }

        .search-container {
            margin-bottom: 20px;
            padding-bottom: 20px;
            padding-top: 5px;
        }

        .search-input {
            width: 250px;
            height: 42px;
            padding-left: 15px;
            border-radius: 42px;
            border: 2px solid #324b4e;
            background: #F9F0DA;
            outline: none;
            transition: .3s linear;
        }

        .search-input:focus {
            width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header
        class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom"
      >
        <a
          href="/"
          class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"
        >
        </a>
  
        <ul class="nav nav-pills">
          <!--  -->
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              href="#"
              id="navbarDropdown"
              role="button"
              data-toggle="dropdown"
              aria-haspopup="true"
              aria-expanded="false"
            >   
              Пользователи
            </a>
            <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                <a class="dropdown-item user-type-option" href="/users.html?role=client" data-type="client">Клиенты</a>
                <a class="dropdown-item user-type-option" href="/users.html?role=man" data-type="man">Менеджеры</a>
                <a class="dropdown-item user-type-option" href="/users.html?role=org" data-type="org">Организаторы</a>
              <a class="dropdown-item" href="/addUser.html">Добавление</a>
            </div>
          </li>
          
        <li class="nav-item">
            <a href="/addApl.html" class="nav-link">Добавить заявку</a>
          </li>
        <li class="nav-item">
            <a href="/reports.html" class="nav-link">Отчеты</a>
          </li>
          <li class="nav-item">
            <a href="login.html" class="nav-link">Аккаунт</a>
          </li>
        </ul>
      </header>
    </div>
    
    <div class="containerr">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="&#128269; Введите имя" class="search-input">
        </div>
        <table>
            <thead>
                <tr>
                    <th>ФИО</th>
                    <th>Email</th>
                    <th>Телефон</th>
                    <th>Блокировка</th>
                    <th>Действие</th>
                    <th>Роль</th>
                </tr>
            </thead>
            <tbody id="userList">
                <!-- Данные будут динамически добавляться здесь -->
            </tbody>
        </table>
    </div>
    <script>
       let clientList = [];
    let currentUserType = 'client'; // по умолчанию

    // Получение параметра из URL (если страница перезагружается с параметром)
    document.addEventListener('DOMContentLoaded', function () {
        const params = new URLSearchParams(window.location.search);
        const role = params.get('role') || 'client';
        fetchData(role);
    });

    // Назначение обработчиков кликов на элементы меню
    document.querySelectorAll('.user-type-option').forEach(item => {
        item.addEventListener('click', function (event) {
            event.preventDefault(); // отменяем переход по ссылке
            const userType = this.dataset.type; // получаем значение data-type
            fetchData(userType);
        });
    });

    function fetchData(userType) {
        currentUserType = userType;
        const url = `http://localhost:8080/users/read/${userType}`;
        fetch(url)
            .then(response => response.json())
            .then(data => {
                clientList = data;
                console.log("Полученные данные:", data);
                populateTable(clientList);
                setupSearch();
            })
            .catch(error => console.error('Ошибка получения данных:', error));
    }
    
    function populateTable(users) {
        const tableBody = document.getElementById('userList');
        tableBody.innerHTML = '';
    
        users.forEach(user => {
            const row = document.createElement('tr');
    
            const fioCell = document.createElement('td');
            fioCell.textContent = user.name;
            row.appendChild(fioCell);
    
            const emailCell = document.createElement('td');
            emailCell.textContent = user.email;
            row.appendChild(emailCell);
    
            const phoneCell = document.createElement('td');
            phoneCell.textContent = user.phone;
            row.appendChild(phoneCell);
    
            const activeCell = document.createElement('td');
            activeCell.textContent = user.active ? 'Да' : 'Нет';
            row.appendChild(activeCell);
    
            const banCell = document.createElement('td');
            const banButton = document.createElement('button');
            banButton.textContent = 'Бан';
            banButton.className = 'ban-button';
            banButton.onclick = function () {
                banClient(user.email);
            };
            banCell.appendChild(banButton);
            row.appendChild(banCell);
    
            // Создание выпадающего списка для изменения роли
            const roleCell = document.createElement('td');
            const roleSelect = document.createElement('select');
    
            const roles = ['ROLE_USER', 'ROLE_MANAGER', 'ROLE_ORGANIZER'];
            roles.forEach(role => {
                const option = document.createElement('option');
                option.value = role;
                option.textContent = role.replace('ROLE_', ''); // Убираем префикс для читаемости
                if (user.role === role) {
                    option.selected = true;
                }
                roleSelect.appendChild(option);
            });
    
            roleSelect.classList.add('form-select'); 
            roleSelect.onchange = function() {
                const newRole = roleSelect.value;
                updateUserRole(user.email, newRole); // обновление роли
            };
    
            roleCell.appendChild(roleSelect);
            row.appendChild(roleCell);
    
            tableBody.appendChild(row);
        });
    }
    
        function updateUserRole(email, newRole) {
            let endpoint = '';
        
            switch (newRole) {
                case 'ROLE_USER':
                    endpoint = 'user';
                    break;
                case 'ROLE_MANAGER':
                    endpoint = 'man';
                    break;
                case 'ROLE_ORGANIZER':
                    endpoint = 'org';
                    break;
                default:
                    console.error('Неверная роль:', newRole);
                    return;
            }
        
            fetch(`http://localhost:8080/users/changerole/${endpoint}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email })
            })
            .then(response => {
                if (response.ok) {
                    console.log(`Роль пользователя ${email} изменена на ${newRole}`);
                    fetchData(currentUserType); // обновляем таблицу после изменения роли
                } else {
                    console.error('Ошибка при смене роли пользователя');
                }
            })
            .catch(error => console.error('Ошибка запроса:', error));
        }
    
    
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function () {
                const filter = searchInput.value.toLowerCase();
                const filteredUsers = clientList.filter(user =>
                    user.name.toLowerCase().includes(filter)
                );
                populateTable(filteredUsers);
            });
        }
    
        function banClient(email) {
            fetch(`http://localhost:8080/users/client/ban`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(email)
            })
                .then(response => {
                    if (response.ok) {
                        console.log("Пользователь заблокирован");
                        fetchData(currentUserType); // Перезагрузить
                    } else {
                        console.error('Ошибка при выполнении POST-запроса');
                    }
                })
                .catch(error => console.error('Ошибка при выполнении POST-запроса:', error));
        }
    
        // Навешиваем обработчики на dropdown пункты
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.user-type-option').forEach(item => {
                item.addEventListener('click', function (e) {
                    e.preventDefault();
                    const userType = this.getAttribute('data-type');
                    fetchData(userType);
                });
            });
    
            fetchData(currentUserType); // Инициализация по умолчанию
        });
    </script>
    
     <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
     <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    
</body>
</html>
