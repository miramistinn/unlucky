    }

            margin: auto;

            border-radius: 8px;

        }

        h1 {
            text-align: center;
            color: #333;
        }
        #adminReportTable td:first-child,
        #adminReportTable th:first-child {
        width: 75%;
        }

<body>

        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"></a>

    <div>
        <ul class="nav nav-pills mb-4">
            <li class="nav-itemm">

          </li>
        </ul>
    </div>
    
    <div class="containerr">
        <h1>Работа организаторов</h1>
        <table id="adminReportTable">
            <thead>
                <tr>
                    <th>ФИО</th>
                    <th>Процент обработанных заявок</th>
                </tr>
            </thead>
            <tbody id="adminReportBody">
            </tbody>
        </table>
    </div>

    <script>
        // Функция для загрузки данных о администраторах
        function fetchAdminReport() {
            fetch('http://localhost:8080/report/admins')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Ошибка при загрузке данных');
                    }
                    return response.json();
                })
                .then(data => {
                    populateTable(data);
                })
                .catch(error => {
                    console.error('Ошибка:', error);
                });
        }

        // Функция для заполнения таблицы данными
        function populateTable(data) {
            const tableBody = document.getElementById('adminReportBody');
            tableBody.innerHTML = ''; // Очистка предыдущих данных

            for (const [fullName, percentage] of Object.entries(data)) {
                const row = document.createElement('tr');

                const nameCell = document.createElement('td');
                nameCell.textContent = fullName;
                row.appendChild(nameCell);

                const percentageCell = document.createElement('td');
                percentageCell.textContent = percentage.toFixed(2) + '%';
                row.appendChild(percentageCell);

                tableBody.appendChild(row);
            }
        }

        // Загружаем данные при загрузке страницы
        window.onload = fetchAdminReport;
    </script>

    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
