    <script>// Получение applicationId из параметров URL
        // Получение applicationId из параметров URL
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
     

// Функция для загрузки данных заявки
function loadApplicationData() {
    // Убедитесь, что applicationId существует
    if (!id) {
        console.error('ID заявки не найден в URL.');
        alert('ID заявки не найден.');
        return;
    }

    fetch(`http://localhost:8080/app/read/${id}`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Ошибка сети: ' + response.statusText);
            }
            return response.text(); // Получаем ответ как текст
        })
        .then(data => {
            // Пытаемся распарсить JSON
            try {
                const application = JSON.parse(data); // Парсинг JSON
                // Заполнение полей формы данными заявки
                document.getElementById('name').value = application.user.name;
                document.getElementById('email').value = application.user.email;
                document.getElementById('phone').value = application.user.phone;
                document.getElementById('comments').value = application.comments;
                document.getElementById('source').value = "Заявка пришла из источника '"+application.source+"'";
            } catch (error) {
                console.error('Ошибка парсинга JSON:', error);
                alert('Не удалось загрузить данные заявки. Ответ сервера не является корректным JSON.');
            }
        })
        .catch(error => {
            console.error('Ошибка:', error);
            alert('Не удалось загрузить данные заявки.');
        });
}

// Повесим обработку на саму форму
document.getElementById('registrationForm').addEventListener('submit', function(event) {
    event.preventDefault(); //  Предотвращаем стандартную отправку формы

    const reason = document.getElementById('reason').value;
    if (!reason) {
        alert("Укажите причину отклонения.");
        return;
    }

    const data = {
        id: id, // <-- глобальный id из URL
        reason: reason
    };

    fetch('http://localhost:8080/app/reject', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
    })
    .then(response => {
        if (!response.ok) {
            return response.text().then(text => { throw new Error(text); });
        }
        window.location.href = '/new.html';
    })
    .catch(error => {
        console.error('Ошибка при отправке формы:', error);
        alert('Ошибка: ' + error.message);
    });
});
