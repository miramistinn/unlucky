    <script>
        function formatDate(dateTime) {
            const options = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            return new Date(dateTime).toLocaleString('ru-RU', options); 
        }
    
        function fetchApplications() {
            fetch('http://localhost:8080/app/client')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Ошибка при загрузке заявок');
                    }
                    return response.json();
                })
                .then(data => {
                    const container = document.getElementById('applicationsContainer');
                    container.innerHTML = ''; 
    
                    if (data.length === 0) {
                        // Если список пуст
                        container.innerHTML = '<p>У Вас еще нет заявок.</p>';
                    } else {
                        // Если есть заявки, добавляем заголовок и создаем таблицу
                        const header = document.createElement('h2');
                        header.className = 'text-center';
                        header.innerText = 'Ваши заявки';
                        container.appendChild(header); // Добавляем заголовок в контейнер
    
                        const table = document.createElement('table');
                        const tableHeader = table.createTHead();
                        const headerRow = tableHeader.insertRow(0);
                        headerRow.insertCell(0).innerText = 'Комментарий';
                        headerRow.insertCell(1).innerText = 'Дата подачи';
                        headerRow.insertCell(2).innerText = 'Статус'; // Новый заголовок для статуса
    
                        const tbody = table.createTBody();
                        data.forEach(application => {
                            const row = tbody.insertRow();
                            row.insertCell(0).innerText = application.comments; // Комментарии
                            row.insertCell(1).innerText = formatDate(application.dateOfCreated); 
                            if (application.status === 'new') {
            row.insertCell(2).innerText = 'Новая';
        } if (application.status === 'proccesing') {
            row.insertCell(2).innerText = 'В обработке';
        }if (application.status=== 'closed') {
            row.insertCell(2).innerText = 'Закрытая';
        }if (application.status=== 'rejected') {
            row.insertCell(2).innerText = 'Отмененная';
        }
                        });
    
                        container.appendChild(table); // Добавляем таблицу в контейнер
                    }
                })
                .catch(error => {
                    console.error('Ошибка:', error);
                    const container = document.getElementById('applicationsContainer');
                    container.innerHTML = '<p>Произошла ошибка при загрузке заявок.</p>';
                });
        }
    
        // Вызываем функцию при загрузке страницы
        window.addEventListener('DOMContentLoaded', fetchApplications);
    </script>
    <script>
        // Функция для обработки выхода
        document.getElementById('logoutLink').addEventListener('click', function(event) {
            event.preventDefault(); // Предотвращаем переход по ссылке
            fetch('http://localhost:8080/log/logout', {
                method: 'POST'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Ошибка выхода');
                }
                return response.text();
            })
            .then(message => {
                window.location.href = '/home.html'; 
            })
            .catch(error => {
                console.error('Ошибка:', error);
                alert('Не удалось выйти из системы.');
            });
        });
    </script>
    <script>
        // Функция для обработки отправки формы
        function submitForm(event) {
            event.preventDefault(); // Предотвращаем отправку формы по умолчанию
    
            // Получаем значения полей формы
            var email = document.getElementById('email').value;
            var phone = document.getElementById('phone').value;
            var name = document.getElementById('name').value;


            var data = {
                fio: name,
                phone: phone,
                email: email,
            
            };
    
            fetch('http://localhost:8080/users/update', {
                method: "post",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Email уже существует'); // Генерируем ошибку, если email уже существует
                }
                return response.json();
            })
            .then(result => {
                // Обработка ответа от сервера после успешной отправки данных
                console.log(result); // Отображаем ответ в консоли
                alert('Данные изменены');
            })
            .catch(error => {
                // Обработка ошибки при отправке запроса
                console.error('Error:', error);
            
                
                // Очищаем форму
                document.getElementById('registrationForm').reset();
            });
        }
    
        // Получаем форму по ее ID
        var form = document.getElementById('registrationForm');
        // Назначаем обработчик события отправки формы
        form.addEventListener('submit', submitForm);
    </script>
    <script>
function fetchUserData() {
fetch('http://localhost:8080/log/users/read')
    .then(response => {
        if (!response.ok) {
            throw new Error('Не удалось загрузить данные пользователя');
        }
        return response.json();
    })
    .then(data => {
        // Заполнение формы полученными данными
        document.getElementById('email').value = data.email || '';
        document.getElementById('name').value = data.name || ''; 
        document.getElementById('phone').value = data.phone || '';
    })
    .catch(error => {
        console.error('Ошибка загрузки данных пользователя:', error);
    });
}
window.addEventListener('DOMContentLoaded', fetchUserData);
    </script>

<script>
    function checkAuth(event) {
        event.preventDefault(); // Предотвращаем переход по ссылке

        fetch('http://localhost:8080/log/users/isauth', {
            method: 'POST'
        })
        .then(response => {
            console.log('Response status:', response.status);
            if (response.status === 204) {
                // Пользователь не авторизован
                window.location.href = '/login.html';
            } else if (response.status === 200) {
                // Пользователь авторизован
                window.location.href = '/accaunt.html';
            } else {
                // Другие ошибки
                throw new Error('Неизвестный ответ сервера');
            }
        })
        .catch(error => {
            console.error('Ошибка:', error);
            alert('Произошла ошибка при запросе.');
        });
    }
</script>
