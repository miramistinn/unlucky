<div class="reg">
    <h2 class="text-center">Оставить заявку, и с вами в близжайшее время свяжется наш менеджер</h2>
    <div style="margin-bottom: 30px;"></div>
    <form id="applicationForm">
        <div class="mb-3">
            <input type="text" class="form-control" id="name" placeholder="Введите ФИО" required readonly>
        </div>
        <div class="mb-3">
            <input type="email" class="form-control" id="email" placeholder="Введите email" required readonly>
        </div>
        <div class="mb-3">
            <input type="tel" class="form-control" id="phone" placeholder="Введите номер телефона" required readonly>
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" id="comments" placeholder="Добавьте комментарий" required>
        </div>
    
        <div class="center">
            <button type="submit" class="btn btn-primary">Отправить</button>
        </div>
    </form>
</div>
    <script>
        // Функция для обработки отправки формы
        function submitForm(event) {
            event.preventDefault(); // Предотвращаем отправку формы по умолчанию
    
            // Получаем значения полей формы
            var name = document.getElementById('name').value;
            var phone = document.getElementById('phone').value;
            var comments = document.getElementById('comments').value;
            var email = document.getElementById('email').value;
    
            // Создаем объект с данными для отправки на сервер
            var data = {
                name: name,
                phone: phone,
                email:email,
                comments: comments,
                source: 'сайт'
            };
    
            // Отправляем POST-запрос на сервер
            fetch('http://localhost:8080/app/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
            if (response.ok) {
                window.location.href = 'home.html';
            } else {
                throw new Error('Ошибка при отправке формы');
            }
        })
        .catch(error => {
            console.error('Ошибка при отправке формы:', error);
            // Обработка ошибки при отправке формы
        });
         
        }
    
        // Получаем форму по ее ID
        var form = document.getElementById('applicationForm');
        // Назначаем обработчик события отправки формы
        form.addEventListener('submit', submitForm);
    </script>
    <script>
        function fetchUserData() {
            fetch('http://localhost:8080/log/users/read')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Не удалось загрузить данные пользователя');
                    }
                    return response.json();
                })
                .then(data => {
                    // Заполнение формы полученными данными
                    document.getElementById('email').value = data.email || '';
                    document.getElementById('name').value = data.name || ''; 
                    document.getElementById('phone').value = data.phone || '';
                })
                .catch(error => {
                    console.error('Ошибка загрузки данных пользователя:', error);
                });
        }
        window.addEventListener('DOMContentLoaded', fetchUserData);
    </script>
