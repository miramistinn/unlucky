        <div class="reg">
            <h2 class="text-center">Данные аккаунта</h2>
            <div style="margin-bottom: 30px;"></div>
            <form id="registrationForm">
                <div class="mb-3">
                    <input type="email" class="form-control" id="email" placeholder="Введите email" required readonly>
                </div>
                
                <div class="mb-3">
                    <input type="text" class="form-control" id="name" placeholder="Введите ФИО" required >
                </div>
                <div class="mb-3">
                    <input type="tel" class="form-control" id="phone" placeholder="Введите номер телефона" required>
                </div>
                <!-- <div class="mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Введите пароль" required>
                </div>
            -->
                <div class="center">

                </div>
            </form>

        <div class="center">
            <div class="mt-3">
                <a href="#" class="link-secondary" id="logoutLink">Выйти</a> 
            </div>

        <script>
            // Функция для обработки выхода
            document.getElementById('logoutLink').addEventListener('click', function(event) {
                event.preventDefault(); // Предотвращаем переход по ссылке
                fetch('http://localhost:8080/log/logout', {
                    method: 'POST'
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Ошибка выхода');
                    }
                    return response.text();
                })
                .then(message => {
                    window.location.href = '/home.html'; 
                })
                .catch(error => {
                    console.error('Ошибка:', error);
                    alert('Не удалось выйти из системы.');
                });
            });
        </script>
        <script>
            // Функция для обработки отправки формы
            function submitForm(event) {
                event.preventDefault(); // Предотвращаем отправку формы по умолчанию
        
                // Получаем значения полей формы
                var email = document.getElementById('email').value;
                var phone = document.getElementById('phone').value;
                var name = document.getElementById('name').value;


                var data = {
                    fio: name,
                    phone: phone,
                    email: email,
                
                };
        
                fetch('http://localhost:8080/users/update', {
                    method: "post",
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Email уже существует'); // Генерируем ошибку, если email уже существует
                    }
                    return response.json();
                })
                .then(result => {
                    // Обработка ответа от сервера после успешной отправки данных
                    console.log(result); // Отображаем ответ в консоли
                    alert('Данные изменены');
                })
                .catch(error => {
                    // Обработка ошибки при отправке запроса
                    console.error('Error:', error);
                
                    
                    // Очищаем форму
                    document.getElementById('registrationForm').reset();
                });
            }
        
            // Получаем форму по ее ID
            var form = document.getElementById('registrationForm');
            // Назначаем обработчик события отправки формы
            form.addEventListener('submit', submitForm);
        </script>
        <script>
function fetchUserData() {
    fetch('http://localhost:8080/log/users/read')
        .then(response => {
            if (!response.ok) {
                throw new Error('Не удалось загрузить данные пользователя');
            }
            return response.json();
        })
        .then(data => {
            // Заполнение формы полученными данными
            document.getElementById('email').value = data.email || '';
            document.getElementById('name').value = data.name || ''; 
            document.getElementById('phone').value = data.phone || '';
        })
        .catch(error => {
            console.error('Ошибка загрузки данных пользователя:', error);
        });
}
window.addEventListener('DOMContentLoaded', fetchUserData);
        </script>
