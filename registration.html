<!DOCTYPE html>
<html>
<head>
    <title>Авторизация</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <!-- <link rel="stylesheet" type="text/css" href="normalize.css" /> -->
    <link rel="stylesheet" type="text/css" href="style.css" />
    <style>
        body {
            background-color: black;
            color: white;
        }
        .reg {
            background-color: #111;
            padding: 20px;
            margin-top: 50px;
            border-radius: 5px;
            margin-left: 500px;
            margin-right: 500px;
        }
        .form-control {
            background-color: #222;
            color: #bbb;
            height: 70px; 
            border-radius: 15px; /* Скругление полей */
            font-size: 18px; /* Увеличение шрифта */
        }
        .mb-3 {
            margin-bottom: 60px; /* Увеличение расстояния между полями ввода */
        }
        .btn-primary {
            background-color: #354095; /* Красный цвет фона */
            border-color: #354095; /* Красный цвет границы */
            padding: 15px 150px; /* Увеличение размера кнопки */
            font-size: 18px; /* Увеличение шрифта кнопки */
            border-radius: 15px; /* Скругление кнопки */
        }
        .btn-primary:hover {
            background-color: #251c4d; /* Более тёмный красный при наведении */
            border-color: #251c4ded; /* Более тёмный красный границы при наведении */
        }
        .center {
            display: flex;
            justify-content: center;
            align-items: center;
            /* margin-top: 40px; */
            margin-bottom: 10px;
        }
        .link-secondary {
            color: #bbb; /* Цвет ссылки */
            font-size: 18px; /* Размер шрифта */
            text-decoration: none; /* Убрать подчеркивание */
        }
        .link-secondary:hover {
            color: #fff; /* Цвет ссылки при наведении */
            text-decoration: underline; /* Подчеркивание при наведении */
        }
        .error-message {
            color: red;
            display: none; /* Скрываем сообщение об ошибке по умолчанию */
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
                <img src="images/img_1.png" width="150" height="40" alt="Картинка">
            </a>
    
            <ul class="nav nav-pills">
                <li class="nav-item"><a href="home.html" class="nav-link" aria-current="page">Главная</a></li>
                <li class="nav-item"><a href="contacs.html" class="nav-link">Контакты</a></li>
                <li class="nav-item"><a href="about.html" class="nav-link ">О нас</a></li>
                <li class="nav-item"><a href="account.html" Регистрация class="nav-link active">Аккаунт</a></li>
            </ul>
        </header>
    </div>
<div class="reg">
    <h2 class="text-center">Регистрация</h2>
    <div style="margin-bottom: 30px;"></div>
    <form id="registrationForm">
        <div class="mb-3">
            <input type="email" class="form-control" id="email" placeholder="Введите email" required>
        </div>
        
        <div class="mb-3">
            <input type="text" class="form-control" id="email" placeholder="Введите ФИО" required>
        </div>
        <div class="mb-3">
            <input type="tel" class="form-control" id="phone" placeholder="Введите номер телефона" required>
        </div>
        <div class="mb-3">
            <input type="password" class="form-control" id="password" placeholder="Введите пароль" required>
        </div>
    
        <div class="center">
            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </div>
        <div class="error-message" id="errorMessage">Пароли не совпадают.</div>
        <div class="error-message" id="emailErrorMessage">Пользователь с таким email уже существует.</div>
    </form>
</div>
<div class="center">
    <div class="mt-3">
        <a href="login.html" class="link-secondary">Войти</a> 
    </div>
</div>
<script>
    // Функция для обработки отправки формы
    function submitForm(event) {
        event.preventDefault(); // Предотвращаем отправку формы по умолчанию

        // Получаем значения полей формы
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        var repassword = document.getElementById('repassword').value;

        // Скрываем все сообщения об ошибках
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('emailErrorMessage').style.display = 'none';

        // Проверяем, совпадают ли пароли
        if (password !== repassword) {
            document.getElementById('errorMessage').style.display = 'block'; // Показываем сообщение об ошибке
            document.getElementById('registrationForm').reset();
            return; // Прекращаем выполнение функции
        }

        // Создаем объект с данными для отправки на сервер
        var data = {
            email: email,
            password: password
        };

        fetch('http://localhost:8080/log/create', {
            method: "post",
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Email уже существует'); // Генерируем ошибку, если email уже существует
            }
            return response.json();
        })
        .then(result => {
            // Обработка ответа от сервера после успешной отправки данных
            console.log(result); // Отображаем ответ в консоли
            window.location.href = "home.html"; // Перенаправление после успешной регистрации
        })
        .catch(error => {
            // Обработка ошибки при отправке запроса
            console.error('Error:', error);
            var errorMessageElement = document.getElementById('emailErrorMessage');
            errorMessageElement.innerText = 'Пользователь с таким email уже существует.';
            errorMessageElement.style.display = 'block'; // Показываем сообщение об ошибке
            
            // Очищаем форму
            document.getElementById('registrationForm').reset();
        });
    }

    // Получаем форму по ее ID
    var form = document.getElementById('registrationForm');
    // Назначаем обработчик события отправки формы
    form.addEventListener('submit', submitForm);
</script>
</body>
</html>
