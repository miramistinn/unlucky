    <style>
        body {

        }
        .mb-3 {

        .btn-primary {

        }

    font-family: 'Arial', sans-serif; /* Измените на нужный шрифт */

}

.form-control {

            height: 70px;

            font-size: 18px; /* Увеличение шрифта */
            

        }

}

.form-control:not(:placeholder-shown) {

}

    border: 1px solid #ccc;
    border-radius: 15px; /* Скругление кнопки */

}

        <ul class="nav nav-pills">

              href="#"

              aria-expanded="false"

    <div class="reg">
        <h2 class="text-center">Добавление заявки</h2>
        <div style="margin-bottom: 30px;"></div>
        <form id="applicationForm">
            <div class="mb-3">
                <input type="text" class="form-control" id="name" placeholder="Введите ФИО" required autocomplete="off">
                <div id="suggestions" class="suggestions"></div> <!-- Контейнер для подсказок -->

            </div>
            <div class="mb-3">
                <input type="email" class="form-control" id="email" placeholder="Введите email" required readonly>
            </div>
            <div class="mb-3">
                <input type="tel" class="form-control" id="phone" placeholder="Введите номер телефона" required readonly>
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" id="comments" placeholder="Добавьте комментарий" required autocomplete="off">
            </div>
            <div class="mb-3">
                <select class="form-control" id="source" required>
                    <option value="" disabled selected hidden>Выберите источник</option>
                    <option value="source1">Офис</option>
                    <option value="source2">Телефон</option>
                    <option value="source3">Почта</option>
                    <option value="source4">Другое</option>
                </select>
            </div>
        
            <div class="center">
                <button type="submit" class="btn btn-primary">Отправить</button>
            </div>
        </form>
    </div>

<script>
    // Функция для обработки отправки формы
    function submitForm(event) {
        event.preventDefault(); // Предотвращаем отправку формы по умолчанию

        // Получаем значения полей формы
        var name = document.getElementById('name').value;
        var email = document.getElementById('email').value;

        var phone = document.getElementById('phone').value;
        var comments = document.getElementById('comments').value;
        var source = document.getElementById('source').value;


        // Создаем объект с данными для отправки на сервер
        var data = {
            name: name,
            email: email,
            phone: phone,
            comments: comments,
            source: source
        };

        // Отправляем POST-запрос на сервер
        fetch('http://localhost:8080/app/create', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => {
        if (response.ok) {
            window.location.href = 'users.html';
        } else {
            throw new Error('Ошибка при отправке формы');
        }
    })
    .catch(error => {
        console.error('Ошибка при отправке формы:', error);
        // Обработка ошибки при отправке формы
    });
     
    }

    // Получаем форму по ее ID
    var form = document.getElementById('applicationForm');
    // Назначаем обработчик события отправки формы
    form.addEventListener('submit', submitForm);
</script>   
<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"> </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
<script>
let clientList = []; 
function fetchData() {
    fetch('http://localhost:8080/users/read/client')
        .then(response => response.json())
        .then(data => {
            clientList = data; // Сохраняем данные в массив
            setupSearch(); // Устанавливаем поиск
        })
        .catch(error => console.error('Ошибка получения данных:', error));
}
function setupSearch() {
    const searchInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');
    const suggestionsContainer = document.getElementById('suggestions');

    searchInput.addEventListener('input', function() {
        const filter = searchInput.value.toLowerCase();
        suggestionsContainer.innerHTML = '';

        if (filter) {
            const filteredClients = clientList.filter(client =>
                client.name && client.name.toLowerCase().includes(filter)
            );

            filteredClients.forEach(client => {
                const suggestionItem = document.createElement('div');
                suggestionItem.textContent = `${client.name} (${client.phone})`;
                suggestionItem.className = 'suggestion-item';

                suggestionItem.addEventListener('click', function() {
                    searchInput.value = client.name;
                    emailInput.value = client.email;
                    phoneInput.value = client.phone;
                    suggestionsContainer.innerHTML = '';
                });

                suggestionsContainer.appendChild(suggestionItem);
            });

            const addUserItem = document.createElement('div');
            addUserItem.textContent = 'Добавить пользователя';
            addUserItem.className = 'suggestion-item';
            addUserItem.style.fontWeight = 'bold';
            addUserItem.addEventListener('click', function() {
                window.location.href = 'addUser.html';
            });

            suggestionsContainer.appendChild(addUserItem);
        }
    });
}

fetchData();
</script>
