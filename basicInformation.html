        <h2 class="text-center">Инофрмация от клиента</h2>

        <form id="registrationForm">
            <div class="mb-3" style="position: relative;">

    <script>
        // Функция для обработки отправки формы
        function submitForm(event) {
            event.preventDefault(); // Предотвращаем отправку формы по умолчанию
    
            // Получаем значения полей формы
            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
    
            var phone = document.getElementById('phone').value;
            var comments = document.getElementById('comments').value;
    
            // Создаем объект с данными для отправки на сервер
            var data = {
                name: name,
                email: email,
                phone: phone,
                comments: comments,
                source: source,
                admincomments:admincomments
            };
    
            // Отправляем POST-запрос на сервер
            fetch('http://localhost:8080/app/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
            if (response.ok) {
                window.location.href = 'home.html';
            } else {
                throw new Error('Ошибка при отправке формы');
            }
        })
        .catch(error => {
            console.error('Ошибка при отправке формы:', error);
            // Обработка ошибки при отправке формы
        });
         
        }
    
        // Получаем форму по ее ID
        var form = document.getElementById('applicationForm');
        // Назначаем обработчик события отправки формы
        form.addEventListener('submit', submitForm);
    </script>  
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
// Функция для загрузки данных заявки
function loadApplicationData() {
    // Убедитесь, что applicationId существует
    if (!id) {
        console.error('ID заявки не найден в URL.');
        alert('ID заявки не найден.');
        return;
    }

    fetch(`http://localhost:8080/app/read/${id}`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Ошибка сети: ' + response.statusText);
            }
            return response.text(); // Получаем ответ как текст
        })
        .then(data => {
            // Пытаемся распарсить JSON
            try {
                const application = JSON.parse(data); // Парсинг JSON
                // Заполнение полей формы данными заявки
                document.getElementById('name').value = application.user.name;
                document.getElementById('email').value = application.user.email;
                document.getElementById('phone').value = application.user.phone;
                document.getElementById('comments').value = application.comments;
                document.getElementById('source').value = application.source;
            } catch (error) {
                console.error('Ошибка парсинга JSON:', error);
                alert('Не удалось загрузить данные заявки. Ответ сервера не является корректным JSON.');
            }
        })
        .catch(error => {
            console.error('Ошибка:', error);
            alert('Не удалось загрузить данные заявки.');
        });
}
let clientList = []; // Массив для хранения данных клиентов

// Функция для выполнения AJAX-запроса
function fetchData() {
    fetch('http://localhost:8080/users/read/client')
        .then(response => response.json())
        .then(data => {
            clientList = data; // Сохраняем данные в массив
            setupSearch(); // Устанавливаем поиск
        })
        .catch(error => console.error('Ошибка получения данных:', error));
}

// Функция для настройки поиска
function setupSearch() {
    const searchInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');
    const suggestionsContainer = document.getElementById('suggestions');

    searchInput.addEventListener('input', function() {
        const filter = searchInput.value.toLowerCase();
        suggestionsContainer.innerHTML = ''; // Очищаем предыдущие подсказки

        if (filter) {
            const filteredClients = clientList.filter(client => 
                client.name.toLowerCase().includes(filter)
            );

            filteredClients.forEach(client => {
                const suggestionItem = document.createElement('div');
                suggestionItem.textContent = `${client.name} (${client.phone})`; // Отображаем ФИО и телефон
                suggestionItem.className = 'suggestion-item';
                
                // Добавляем обработчик клика для выбора подсказки
                suggestionItem.addEventListener('click', function() {
                    searchInput.value = client.name; // Заполнение поля ФИО
                    emailInput.value = client.email; // Заполнение поля email
                    phoneInput.value = client.phone; // Заполнение поля телефон
                    suggestionsContainer.innerHTML = ''; // Очищаем подсказки
                });

                suggestionsContainer.appendChild(suggestionItem);
            });

            // Добавляем опцию "Добавить пользователя"
            const addUserItem = document.createElement('div');
            addUserItem.textContent = 'Добавить пользователя';
            addUserItem.className = 'suggestion-item';
            addUserItem.style.fontWeight = 'bold'; // Увеличиваем шрифт для выделения
            addUserItem.addEventListener('click', function() {
                window.location.href = 'addUser.html'; // Переход на страницу добавления пользователя
            });

            suggestionsContainer.appendChild(addUserItem);
        }
    });
}

window.onload = function () {
    loadApplicationData();
    fetchData(); // ВАЖНО: добавьте этот вызов
};
        document.getElementById('baseLink').addEventListener('click', function() {
