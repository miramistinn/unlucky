<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заявки</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: black;
            color: white;
        }

        .filter-container {
            margin-bottom: 20px;
        }

        .nav-itemm {
            margin-right: 20px;
        }

        .nav-itemm:hover {
            color: #c9d6e3;
            transform: translateY(-5px);
        }

        .nav {
            padding-left: 12.5%;
        }

        .form-control {
            border-radius: 15px; /* Скругление полей */
        }

        .mb-3 {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            color: #333;
        }

        label {
            margin-right: 10px;
            width: 150px; /* Ширина лейбла */
        }

        .text-center {
            text-align: center;
            font-family: 'Arial', sans-serif;
            font-size: 24px;
            color: #333;
        }

        .reg {
            max-width: 1100px;
            border: 1px solid #ccc;
            border-radius: 16px;
            background-color: rgba(209, 206, 206, 0.874);
            margin: 20px auto;
            padding: 20px;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .btn-primary {
            background-color: #354095;
            padding: 15px 150px;
            font-size: 18px;
            border-radius: 15px;
        }

        .btn-primary:hover {
            background-color: #251c4d;
        }

        .suggestions {
            border: 1px solid #ccc;
            border-radius: 15px;
            max-height: 150px;
            overflow-y: auto;
            position: absolute;
            top: 100%;
            left: 0;
            width: 70%;
            background-color: white;
            z-index: 1000;
            color: black;
            margin-left: 135px;
        }

        .suggestion-item {
            padding: 10px;
            cursor: pointer;
        }

        .suggestion-item:hover {
            background-color: #e0e0e0;
        }
        .nav-link {
            color: white; 
            transition: color 0.3s, transform 0.3s; /* Плавный переход для цвета и смещения */
        }

        .nav-link:hover {
            color: #c9d6e3; 
            transform: translateY(-5px); /* Смещение вверх при наведении */
        }
    </style>
</head>
<body>   
    <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"></a>
            <ul class="nav nav-pills">
                <li class="nav-item">
                    <a href="/new.html" class="nav-link">Новые</a>
                </li>
                <li class="nav-item">
                    <a href="/process.html" class="nav-link">Действующие</a>
                </li>
                <li class="nav-item">
                    <a href="/closed.html" class="nav-link">Закрытые</a>
                </li>
                <li class="nav-item">
                    <a href="/logoutorg.html" class="nav-link">Аккаунт</a>
                </li>
            </ul>
        </header>
    </div>
    <div>
        <ul class="nav nav-pills mb-4">
            <li class="nav-itemm">
                <a class="nav-link" href="#" id="baseLink">Базовая информация</a>
            </li>
            <li class="nav-itemm">
                <a class="nav-link" href="#" id="menuLink">Смета</a>
            </li>
            <li class="nav-itemm">
                <a class="nav-link" href="#" id="dopServicesLink">Расписание</a>
            </li>
            <li class="nav-itemm">
                <a class="nav-link" href="#" id="closeApplicationLink">Закрыть заявку</a>
            </li>
        </ul>
    </div>
    <div class="reg">
        <h2 class="text-center">Информация от клиента</h2>
        <form id="registrationForm">
            <div class="mb-3" style="position: relative;">
                <label for="name">ФИО:</label>
                <input type="text" class="form-control" id="name" required autocomplete="off">
                <div id="suggestions" class="suggestions"></div>
            </div>
            <div class="mb-3">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" required readonly>
            </div>
            <div class="mb-3">
                <label for="phone">Номер телефона:</label>
                <input type="tel" class="form-control" id="phone" required readonly>
            </div>
            <div class="mb-3">
                <label for="comments">Комментарий от клиента:</label>
                <input type="text" class="form-control" id="comments" required autocomplete="off">
            </div>
            <div class="mb-3">
                <label for="source">Источник:</label>
                <input type="text" class="form-control" id="source" required autocomplete="off">
            </div>
            <div class="mb-3">
                <label for="admincomments">Комментарий:</label>
                <textarea class="form-control" id="admincomments" rows="4" required autocomplete="off"></textarea>
            </div>
            <div class="center">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <button type="button" id="printContractButton" class="btn btn-primary" style="margin-left: 10px;">Печать договора</button>
            </div>
        </form>
    </div>
    <script>
document.getElementById('printContractButton').addEventListener('click', function () {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    
    if (!id) {
        alert('ID заявки не найден.');
        return;
    }

    console.log('Запрос на сервер с ID:', id); // Логируем ID для отладки

    fetch(`http://localhost:8080/proc/generate-doc/${id}`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Ошибка при получении документа');
            }
            return response.blob();  // Если ответ - файл
        })
        .then(blob => {
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `dogovor_${id}.docx`; // Имя для скачивания
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
            alert('Документ готов к скачиванию.');
        })
        .catch(error => {
            console.error('Ошибка:', error);
            alert('Произошла ошибка при запросе.');
        });
});

    

        // Функция для обработки отправки формы
        function submitForm(event) {
            event.preventDefault(); // Предотвращаем отправку формы по умолчанию

            // Получаем значения полей формы
            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            var phone = document.getElementById('phone').value;
            var comments = document.getElementById('comments').value;
            var source = document.getElementById('source').value; // Добавлено
            var admincomments = document.getElementById('admincomments').value; // Добавлено

            // Создаем объект с данными для отправки на сервер
            var data = {
                name: name,
                email: email,
                phone: phone,
                comments: comments,
                source: source,
                admincomments: admincomments,
                id: id 
            };

            // Отправляем POST-запрос на сервер
            fetch('http://localhost:8080/app/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) {
                } else {
                    throw new Error('Ошибка при отправке формы');
                }
            })
            .catch(error => {
                console.error('Ошибка при отправке формы:', error);
                alert('Не удалось отправить данные.');
            });
        }

        // Получаем форму по ее ID
        var form = document.getElementById('registrationForm'); // Исправлено ID формы
        // Назначаем обработчик события отправки формы
        form.addEventListener('submit', submitForm);

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        // Функция для загрузки данных заявки
        function loadApplicationData() {
            if (!id) {
                console.error('ID заявки не найден в URL.');
                alert('ID заявки не найден.');
                return;
            }

            fetch(`http://localhost:8080/app/read/${id}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Ошибка сети: ' + response.statusText);
                    }
                    return response.json(); // Изменено на .json()
                })
                .then(pr => {
                    // Заполнение полей формы данными заявки
                    document.getElementById('name').value = pr.application.user.name;
                    document.getElementById('email').value = pr.application.user.email;
                    document.getElementById('phone').value = pr.application.user.phone;
                    document.getElementById('comments').value = pr.application.comments;
                    document.getElementById('source').value = pr.application.source;
                    document.getElementById('admincomments').value = pr.orgComments;

                })
                .catch(error => {
                    console.error('Ошибка:', error);
                    alert('Не удалось загрузить данные заявки.');
                });
        }

        // Получение данных клиентов
        let clientList = [];

        function fetchData() {
            fetch('http://localhost:8080/users/read/client')
                .then(response => response.json())
                .then(data => {
                    clientList = data;
                    setupSearch();
                })
                .catch(error => console.error('Ошибка получения данных:', error));
        }

        // Функция для настройки поиска
        function setupSearch() {
            const searchInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const phoneInput = document.getElementById('phone');
            const suggestionsContainer = document.getElementById('suggestions');

            searchInput.addEventListener('input', function() {
                const filter = searchInput.value.toLowerCase();
                suggestionsContainer.innerHTML = '';

                if (filter) {
                    const filteredClients = clientList.filter(client => 
                        client.name.toLowerCase().includes(filter)
                    );

                    filteredClients.forEach(client => {
                        const suggestionItem = document.createElement('div');
                        suggestionItem.textContent = `${client.name} (${client.phone})`;
                        suggestionItem.className = 'suggestion-item';
                        
                        suggestionItem.addEventListener('click', function() {
                            searchInput.value = client.name;
                            emailInput.value = client.email;
                            phoneInput.value = client.phone;
                            suggestionsContainer.innerHTML = '';
                        });

                        suggestionsContainer.appendChild(suggestionItem);
                    });

                    const addUserItem = document.createElement('div');
                    addUserItem.textContent = 'Добавить пользователя';
                    addUserItem.className = 'suggestion-item';
                    addUserItem.style.fontWeight = 'bold';
                    addUserItem.addEventListener('click', function() {
                        window.location.href = 'addUser.html';
                    });

                    suggestionsContainer.appendChild(addUserItem);
                }
            });
        }

        window.onload = function () {
            loadApplicationData();
            fetchData();
        };

        document.getElementById('baseLink').addEventListener('click', function() {
            window.location.href = `/basicInformation.html?id=${id}`;
        });
        document.getElementById('menuLink').addEventListener('click', function() {
            window.location.href = `/smeta.html?id=${id}`;
        });
        document.getElementById('dopServicesLink').addEventListener('click', function() {
            window.location.href = `/scedule.html?id=${id}`;
        });
        document.getElementById('closeApplicationLink').addEventListener('click', function() {
            fetch(`http://localhost:8080/app/close/${id}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = 'new.html';
                } else {
                    throw new Error('Ошибка при закрытии');
                }
            });
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
</body>
</html>
