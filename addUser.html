    </div>
<div class="reg">
    <h2 class="text-center">Добавление пользователя</h2>
    <div style="margin-bottom: 30px;"></div>
    <form id="registrationForm">
        <div class="mb-3">
            <input type="email" class="form-control" id="email" placeholder="Email" required>
        </div>
        
        <div class="mb-3">
            <input type="text" class="form-control" id="name" placeholder="ФИО" required>
        </div>
        <div class="mb-3">
            <input type="tel" class="form-control" id="phone" placeholder="Номер телефона" required>
        </div>
        <div class="mb-3">
            <input type="password" class="form-control" id="password" placeholder="Введите пароль" required>
        </div>
        <div class="mb-3">
            <select class="form-control" id="role" required>
                <option value="" disabled selected hidden>Роль</option>
                <option value="user">Клеинт</option>
                <option value="man">Менеджер</option>
                <option value="org">Организатор</option>
            </select>
        </div>
        <div class="center">
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
        <div class="error-message" id="errorMessage">Пароли не совпадают.</div>
        <div class="error-message" id="emailErrorMessage">Пользователь с таким email уже существует.</div>
    </form>
</div>
<script>
    // Функция для обработки отправки формы
    function submitForm(event) {
        event.preventDefault(); // Предотвращаем отправку формы по умолчанию

        // Получаем значения полей формы
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        var phone = document.getElementById('phone').value;
        var name = document.getElementById('name').value;
        var role = document.getElementById('role').value;


        // Скрываем все сообщения об ошибках
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('emailErrorMessage').style.display = 'none';

        

        // Создаем объект с данными для отправки на сервер
        var data = {
            fio: name,
            phone: phone,
            email: email,
            password: password,
            role: role
        };

        fetch('http://localhost:8080/users/create', {
            method: "post",
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Email уже существует'); // Генерируем ошибку, если email уже существует
            }
            return response.json();
        })
        .then(result => {
            // Обработка ответа от сервера после успешной отправки данных
            console.log(result); // Отображаем ответ в консоли
            window.location.href = "users.html"; // Перенаправление после успешной регистрации
        })
        .catch(error => {
            // Обработка ошибки при отправке запроса
            console.error('Error:', error);
            var errorMessageElement = document.getElementById('emailErrorMessage');
            errorMessageElement.innerText = 'Пользователь с таким email уже существует.';
            errorMessageElement.style.display = 'block'; // Показываем сообщение об ошибке
            
            // Очищаем форму
            document.getElementById('registrationForm').reset();
        });
    }

    // Получаем форму по ее ID
    var form = document.getElementById('registrationForm');
    // Назначаем обработчик события отправки формы
    form.addEventListener('submit', submitForm);
</script>
</body>
